name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-2019

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build app
        run: python -m PyInstaller --noconfirm --windowed --name TicketGenerator main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicketGenerator-windows
          path: dist/TicketGenerator
